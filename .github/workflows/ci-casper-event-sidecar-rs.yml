---
name: ci-casper-sidecar

on:
  push:
    branches:
      - "dev"
      - "feat-*"
      - "rc-*"
    paths-ignore:
      - "**.md"

  pull_request:
    branches:
      - "dev"
      - "feat-evm"
    paths-ignore:
      - "**.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b #v3.0.2
      #- uses: Swatinem/rust-cache@6720f05bc48b77f96918929a9019fb2203ff71f8
      #  with:
      #    shared-key: ${{ matrix.os }}

      - name: update toolchain
        run: rustup update

      - name: fmt
        run: cargo fmt -- --check

      - name: clippy
        run: cargo clippy --all-targets -- --deny warnings

      - name: audit
        # RUSTSEC-2025-0141 - bincode is unmaintained but it's the nodes dependency
        # RUSTSEC-2023-0071 - there is a transitive audit issue via sqlx. There is no fix for that yet, we should update dependencies once a fix is presented
        # RUSTSEC-2026-0173 - proc-macro-error2 is unmainteined
        # RUSTSEC-2026-0387 - Casper types and Alloy pin k256 0.13, which needs
        # crypto-bigint 0.5. Remove when the node and Alloy use crypto-bigint >=0.7.6.
        # RUSTSEC-2026-0542 - Casper types uses humantime for timestamps and durations.
        # Remove when Casper types migrates to maintained parsers.
        # RUSTSEC-2024-0436 - Casper types pins Alloy primitives 1.6.0, which uses paste.
        # Remove when the node and sidecar adopt an Alloy release without paste.
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2026-0173
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0387
          --ignore RUSTSEC-2026-0542
          --ignore RUSTSEC-2024-0436

      - name: install PostgreSQL 17 for tests
        # The embedded archive requires a newer glibc than Ubuntu 22.04 provides.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17

      - name: test
        env:
          CASPER_TEST_POSTGRESQL_DIR: /usr/lib/postgresql/17
        run: cargo test

      - name: install cargo packaging tools
        run: |
          cargo install cargo-deb

      - name: deb
        run: cargo deb --package casper-sidecar
