# ==================================================
# Configuration options for the JSON-RPC HTTP server
# ==================================================
[rpc_server.main_server]
# Enables the JSON-RPC HTTP server.
enable_server = true

# Listening address for JSON-RPC HTTP server.  If the port is set to 0, a random port will be used.
#
# If the specified port cannot be bound to, a random port will be tried instead.  If binding fails,
# the JSON-RPC HTTP server will not run, but the node will be otherwise unaffected.
#
# The actual bound address will be reported via a log line if logging is enabled.
ip_address = '0.0.0.0'
port = 7777

# The global maximum rate of HTTP requests (per second) before they are limited.
# Request will be delayed to the next one second bucket once limited.
qps_limit = 100

# Maximum number of bytes to accept in a single request body.
max_body_bytes = 4_000_000

# Maximum number of entries accepted in one JSON-RPC batch.
max_batch_items = 100

# Soft maximum serialized JSON-RPC batch response size in bytes.
max_batch_response_bytes = 25_000_000

# Maximum number of blocks an Ethereum log query or subscription catch-up range can scan.
max_eth_log_block_range = 10_000

# Specifies which origin will be reported as allowed by RPC server.
#
# If left empty, CORS will be disabled.
# If set to '*', any origin is allowed.
# Otherwise, only a specified origin is allowed. The given string must conform to the [origin scheme](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Origin).
cors_origin = ''

# Default limit for JSON-RPC requests: maximum requests permitted in a period of time (below).
default_limit_requests = 100
# Default period of time for the JSON-RPC request limit (above) in human-readable format.
default_limit_period = "1s"

# Limit for JSON-RPC method "get_status". See description for `default_limit_requests` and
# `default_limit_period` above.
[rpc_server.main_server.limits.info_get_status]
requests = 200
period = "1s"

# =========================================
# Configuration options for the node client
# =========================================
[rpc_server.node_client]
# The address of the node to connect to.
ip_address = '127.0.0.1'
port = 7779
# The node's REST API port, used to fetch node status over HTTP (e.g. for eth_syncing) instead
# of the binary port.
rest_port = 8888
# Maximum size of a message in bytes.
max_message_size_bytes = 134_217_728
# Timeout for a node request in seconds.
message_timeout_secs = 10
# Timeout specifying how long to wait for binary port client to be available.
client_access_timeout_secs = 10
# The amount of time in milliseconds to wait between sending keepalive requests.
keepalive_timeout_ms = 4_000

[rpc_server.node_client.exponential_backoff]
# The initial delay in milliseconds before the first retry.
initial_delay_ms = 1000
# The maximum delay in milliseconds before a retry.
max_delay_ms = 32_000
# The multiplier to apply to the previous delay to get the next delay.
coefficient = 2
# Maximum number of connection attempts.
max_attempts = 30

# ====================================================================
# Configuration options for the persistent (LMDB-backed) binary port
# cache. Disabled by default - uncomment to enable. Caches immutable,
# identifier-addressed historical data (block headers, blocks with
# signatures, transactions with execution info) fetched over the
# node's binary port, surviving sidecar restarts.
# ====================================================================
# [rpc_server.binary_port_cache]
# Directory backing the LMDB environment. Created on startup if missing.
# path = '/var/lib/casper-sidecar/binary_port_cache'
#
# Upper bound (bytes) on the LMDB environment size (map_size). This is a
# hard ceiling fixed at startup and is not grown automatically.
# max_size_bytes = 536_870_912


