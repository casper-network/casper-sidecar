[package]
name = "casper-rpc-sidecar"
version = "2.0.0"
authors = ["Jakub Zajkowski <jakub@casper.network>"]
edition = "2024"
description = "The Casper blockchain RPC sidecard"
documentation = "https://docs.rs/casper-rpc-sidecar"
readme = "README.md"
homepage = "https://docs.casper.network"
repository = "https://github.com/casper-network/casper-sidecar/tree/dev/rpc_sidecar"
license = "Apache-2.0"

[dependencies]
casper-event-types.workspace = true
casper-types = { workspace = true, features = ["datasize", "std-fs-io"] }
anyhow = { workspace = true }
async-trait = "0.1"
base16 = "0.2"
bincode = "1"
bytes = "1.10"
casper-json-rpc.workspace = true
casper-binary-port.workspace = true
datasize = { workspace = true, features = ["detailed", "fake_clock-types"] }
derive-new = { workspace = true }
futures = { workspace = true }
governor = { workspace = true }
# Pinned: 0.22.1 uses the unstable `unsigned_is_multiple_of` feature, requiring a newer rustc
# than this workspace's MSRV.
heed = { version = "=0.22.0", default-features = false }
http = "0.2"
hyper = "0.14"
metrics = { workspace = true }
num-rational = { version = "0.4", default-features = false, features = ["serde"] }
num-traits = { version = "0.2", default-features = false }
portpicker = "0.1"
rand = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
schemars = { version = "0.8", features = [
    "preserve_order",
    "impl_json_schema",
] }
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-map-to-array = "1.1"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.6", features = ["codec"] }
toml = { workspace = true }
tracing = { workspace = true, default-features = true }
warp = { workspace = true, features = ["compression"] }
alloy-consensus = { version = "=1.0.41", default-features = false }
alloy-primitives = { version = "=1.5.7", default-features = false, features = ["rlp"] }
alloy-eips = { version = "=1.4.2", default-features = false }

[dev-dependencies]
casper-types = { workspace = true, features = [
    "datasize",
    "std-fs-io",
    "testing",
] }
assert-json-diff = "2"
casper-binary-port = { workspace = true, features = ["testing"] }
mockito = "1.2"
pretty_assertions = "1"
regex = "1"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
jsonschema = { workspace = true }
alloy-consensus = { version = "=1.0.41", default-features = false, features = ["k256"] }
alloy-eips = { version = "=1.4.2", default-features = false, features = ["k256"] }

[build-dependencies]
anyhow = { workspace = true }
# Pinned: 9.1.0 bumps vergen's own dependency on vergen-lib to 9.1.0, which conflicts with
# vergen-gitcl 1.0.8's dependency on vergen-lib 0.1.6 (two incompatible `Add` trait impls).
vergen = { version = "=9.0.6", features = ["build", "cargo", "rustc"] }
vergen-gitcl = { version = "1.0.0", features = ["build", "cargo", "rustc"] }

[features]
testing = ["casper-types/testing", "casper-binary-port/testing"]

[package.metadata.deb]
revision = "0"
assets = [
    [
        "../target/release/casper-rpc-sidecar",
        "/usr/bin/casper-rpc-sidecar",
        "755",
    ],
]
maintainer-scripts = "../resources/maintainer_scripts/debian"
extended-description = """
Package for Casper RPC sidecar.

For information on using package, see https://github.com/casper-network/casper-node
"""

[package.metadata.deb.systemd-units]
unit-scripts = "../resources/maintainer_scripts/casper_rpc_sidecar"
restart-after-upgrade = false
