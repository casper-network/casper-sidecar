[package]
name = "casper-event-sidecar"
authors = [
    "George Williamson <george@casperlabs.io>",
    "Jakub Zajkowski <jakub@casperlabs.io>",
]
version = "1.0.4"
edition = "2018"
readme = "README.md"
description = "App for storing and republishing sse events of a casper node"
license-file = "../LICENSE"
documentation = "README.md"
homepage = "https://github.com/casper-network/casper-sidecar/"
repository = "https://github.com/casper-network/casper-sidecar/"

[features]
additional-metrics = [
    "casper-event-types/additional-metrics",
    "metrics/additional-metrics",
]
testing = []

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1.56"
bytes = "1.2.0"
casper-event-listener = { workspace = true }
casper-event-types = { workspace = true }
casper-types = { workspace = true }
derive-new = { workspace = true }
eventsource-stream = "0.2.3"
futures = { workspace = true }
hex = "0.4.3"
hex_fmt = "0.3.0"
http = "0.2.1"
hyper = "0.14.4"
itertools = { workspace = true }
metrics = { workspace = true }
pin-project = "1.1"
rand = { workspace = true }
regex = "1.6"
reqwest = "0.12"
schemars = "0.8"
sea-query = "0.32"
serde = { workspace = true, default-features = true, features = [
    "derive",
    "rc",
] }
serde_json = "1.0"
sqlx = { version = "0.8", features = [
    "runtime-tokio-native-tls",
    "sqlite",
    "postgres",
] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.4", features = ["buffer", "limit", "make", "timeout"] }
tracing = { workspace = true, default-features = true }
utoipa = { version = "4", features = ["rc_schema"] }
warp = { workspace = true, features = ["compression"] }
wheelbuf = "0.2"

[dev-dependencies]
async-stream = { workspace = true }
casper-event-types = { workspace = true, features = ["sse-data-testing"] }
casper-types = { workspace = true, features = ["testing"] }
colored = "2.0"
futures-util = { workspace = true }
once_cell = { workspace = true }
pg-embed = { git = "https://github.com/faokunega/pg-embed", tag = "v0.9.0" }
portpicker = "0.1"
pretty_assertions = "1"
reqwest = { version = "0.12", features = ["stream"] }
tabled = { version = "0.18", features = ["derive"] }
tempfile = "3"
tokio-util = "0.6"
