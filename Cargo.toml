[workspace]
resolver = "3"
members = [
    "event_sidecar",
    "json_rpc",
    "listener",
    "metrics",
    "rpc_sidecar",
    "sidecar",
    "types",
]

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
casper-types = { git = "https://github.com/casper-network/casper-node.git", branch = "release-2.0.2", features = [
    "json-schema",
    "std",
] }
casper-binary-port = { git = "https://github.com/casper-network/casper-node.git", branch = "release-2.0.2" }
casper-event-listener = { version = "1.0.5", path = "./listener" }
casper-event-sidecar = { version = "1.0.5", path = "./event_sidecar" }
casper-event-types = { version = "1.0.5", path = "./types" }
casper-rpc-sidecar = { version = "1.0.5", path = "./rpc_sidecar" }
metrics = { version = "1.0.5", path = "./metrics" }
datasize = "0.2"
derive-new = "0.7"
futures = "0"
futures-util = "0.3"
governor = { version = "0.10", default-features = false, features = [
    "dashmap",
    "std",
] }
itertools = "0.14"
jsonschema = "0.30"
rand = "0.8"
serde = { version = "1", default-features = false }
thiserror = "2"
tokio = "1"
toml = "0.8"
tracing = { version = "0", default-features = false }
tracing-subscriber = "0"
warp = { version = "0.3" }
