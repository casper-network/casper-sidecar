[package]
name = "casper-json-rpc"
version = "3.0.0"
authors = ["Jakub Zajkowski <jakub@casper.network>"]
edition = "2024"
description = "A library suitable for use as the framework for a JSON-RPC server."
readme = "README.md"
documentation = "https://docs.rs/casper-json-rpc"
homepage = "https://docs.casper.network/"
repository = "https://github.com/casper-network/casper-sidecar/tree/master/json_rpc"
license = "Apache-2.0"

[dependencies]
bytes = "1.10"
casper-types = { workspace = true, features = ["datasize"] }
datasize = { workspace = true }
futures = { workspace = true }
governor = { workspace = true }
http = "1"
itertools = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { version = "^1.0.149", features = ["arbitrary_precision", "preserve_order"] }
tracing = { workspace = true, default-features = true }
warp = { workspace = true }

[dev-dependencies]
env_logger = "0.11"
http-body-util = "0.1"
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "test-util",
] }
warp = { workspace = true, features = ["test"] }
